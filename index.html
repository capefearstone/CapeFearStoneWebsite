    <script>
      (function () {
        var identityTokenNames = ["invite_token", "recovery_token", "confirmation_token", "access_token"];
        var hash = window.location.hash;

        if (!hash || window.location.pathname === "/admin/") {
          return;
        }

        var hashParams = new URLSearchParams(hash.replace(/^#\/?/, ""));
        var hasIdentityToken = identityTokenNames.some(function (tokenName) {

        });

        if (hasIdentityToken) {
          window.location.replace("/admin/" + hash);
