<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A CMS-ready landscaping and hardscaping website with project galleries, testimonials, and a contact form."
    />
    <title>Cape Fear Stone</title>
    <script>
      (function () {
        var identityTokenNames = ["invite_token", "recovery_token", "confirmation_token", "access_token"];
        var hash = window.location.hash;

        if (!hash || window.location.pathname === "/admin/") {
          return;
        }

        var hashParams = new URLSearchParams(hash.replace(/^#\/?/, ""));
        var hasIdentityToken = identityTokenNames.some(function (tokenName) {
          return hashParams.has(tokenName);
        });

        if (hasIdentityToken) {
          window.location.replace("/admin/" + hash);
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <form name="project-inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="project-inquiry" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <textarea name="message"></textarea>
    </form>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
